name: Workflow for distacare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (PR only)
        uses: docker/build-push-action@v5
        if: ${{ github.event_name == 'pull_request' }}
        with:
          context: .
          push: false
          tags: 518569466516.dkr.ecr.us-east-1.amazonaws.com/shopify_app_dista_checkout:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 518569466516.dkr.ecr.us-east-1.amazonaws.com
        if: ${{ github.event_name != 'pull_request' }}

      - name: Compute image tag
        id: image-tag
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        if: ${{ github.event_name != 'pull_request' }}
        with:
          context: .
          push: true
          tags: 518569466516.dkr.ecr.us-east-1.amazonaws.com/shopify_app_dista_checkout:${{ steps.image-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
        if: ${{ github.event_name != 'pull_request' }}

      - name: Configure kubectl
        run: |
          aws eks --region us-east-1 update-kubeconfig --name distacart-prod
          kubectl get nodes
        if: ${{ github.event_name != 'pull_request' }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'
        if: ${{ github.event_name != 'pull_request' }}

      - name: Deploy to Kubernetes
        working-directory: chart
        run: |
          helm upgrade -i shopify_app_dista_checkout . -n shopify_app_dista_checkout --create-namespace --set image.tag=${{ steps.image-tag.outputs.tag }} -f values.yaml
        if: ${{ github.event_name != 'pull_request' }}