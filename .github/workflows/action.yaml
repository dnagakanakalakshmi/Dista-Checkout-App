name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: distacartinc/dista-infra/.github/workflows/ci-node.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      ecr_repository: shopify_app_dista_checkout
      release_name: shopify-app-dista-checkout
      namespace: shopify-app-dista-checkout
      private_modules: false
      ci_command: ":"
