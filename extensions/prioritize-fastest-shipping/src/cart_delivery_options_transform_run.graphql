query CartDeliveryOptionsTransformRunInput {
  cart {
    deliveryGroups {
      deliveryAddress {
        countryCode
      }
      deliveryOptions {
        handle
        title
        cost {
          amount
        }
      }
    }
  }
  shop {
    metafield(namespace: "distacart", key: "prioritize_fastest_shipping_countries") {
      jsonValue
      value
    }
  }
}