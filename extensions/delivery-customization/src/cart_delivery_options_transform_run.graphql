query CartDeliveryOptionsTransformRunInput {
  cart {
    deliveryGroups {
      id
      deliveryAddress {
        countryCode
      }
      deliveryOptions {
        handle
        title
        description
      }
    }
    lines {
      id
      quantity
      merchandise {
        ... on ProductVariant {
          id
          metafield(namespace: "distacart", key: "product_ready_to_ship") {
            jsonValue
          }
          rapidDeliveryEligible: metafield(namespace: "distacart", key: "rapid_delivery") {
            jsonValue
          }
          product {
            hasTags(tags: ["Online Product"]) {
              tag
              hasTag
            }
          }
        }
      }
    }
  }

  shop {
    localTime {
      date
    }
    metafield(namespace: "distacart", key: "delivery_templates") {
      jsonValue
    }
    readyToShipRegular: metafield(namespace: "distacart", key: "ready_to_ship_regular") {
      jsonValue
    }
    readyToShipOnlineOrders: metafield(namespace: "distacart", key: "ready_to_ship_online_orders") {
      jsonValue
    }
    fallbackDispatchDays: metafield(namespace: "distacart", key: "estimated_delivery_fallback_days") {
      jsonValue
    }
  }
}