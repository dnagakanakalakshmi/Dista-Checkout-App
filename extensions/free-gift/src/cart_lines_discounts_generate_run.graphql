query CartInput($freegiftCollectionIds: [ID!]!, $tags: [String!]!) {
  cart {
    attribute(key: "appbrew_instance_id") {
      value
    }
    lines {
      id
      quantity
      cost {
        totalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            productType
            inAnyCollection(ids: $freegiftCollectionIds)
            hasTags(tags: $tags) {
              tag
              hasTag
            }
          }
        }
      }
      autoGiftAttribute: attribute(key: "_auto_gift") {
        value
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "gift_campaign_config") {
      jsonValue
    }
  }
}
