query Input {
  localization {
    country {
      isoCode
    }
  }
  cart {
    lines {
      id
      quantity
      bargainPrice: attribute(key: "Bargain Price") {
        value
      }
      originalPrice: attribute(key: "Original Price") {
        value
      }
      merchandise {
        ... on ProductVariant {
          id
          product {
            quantityDiscounts: metafield(
              namespace: "distacart"
              key: "volume_discount_config"
            ) {
              value
            }
          }
        }
      }
      cost{
        compareAtAmountPerQuantity{
          amount
        }
        amountPerQuantity{
          amount
        }
      }
    }
  }
  discount {
    discountClasses
  }
}