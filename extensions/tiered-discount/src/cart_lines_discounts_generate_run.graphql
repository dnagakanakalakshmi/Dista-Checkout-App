query Input {
  # shop {
  #   metafield(namespace: "appstle_subscription", key: "shop_info") {
  #     value
  #   }
  # }
  localization {
    country {
      isoCode
    }
  }
  cart {
    # attribute(key: "isBVariant") {
    #   value
    # }
    lines {
      id
      quantity
      # bargainPrice: attribute(key: "Bargain Price") {
      #   value
      # }
      # originalPrice: attribute(key: "Original Price") {
      #   value
      # }
      merchandise {
        ... on ProductVariant {
          id
          product {
            quantityDiscounts: metafield(
              namespace: "distacart"
              key: "volume_discount_config"
            ) {
              jsonValue
            }
          }
        }
      }
      cost{
        compareAtAmountPerQuantity{
          amount
        }
        amountPerQuantity{
          amount
        }
      }
    }
  }
  discount {
    discountClasses
  }
}