{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shopify_app_dista_checkout.fullname" . }}
type: Opaque
stringData:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.shopifyApiKey }}
  SHOPIFY_API_KEY: {{ .Values.secrets.shopifyApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.shopifyApiSecret }}
  SHOPIFY_API_SECRET: {{ .Values.secrets.shopifyApiSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.scopes }}
  SCOPES: {{ .Values.secrets.scopes | quote }}
  {{- end }}
  {{- if .Values.secrets.mongodbUrl }}
  MONGODB_URL: {{ .Values.secrets.mongodbUrl | quote }}
  {{- end }}
{{- end }}

