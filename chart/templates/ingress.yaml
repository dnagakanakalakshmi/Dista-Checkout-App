{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shopify_app_dista_checkout.fullname" . }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    {{- if .Values.ingress.healthCheckPath }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.healthCheckPath | quote }}
    {{- end }}
    {{- if .Values.ingress.healthCheckIntervalSeconds }}
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: {{ .Values.ingress.healthCheckIntervalSeconds | quote }}
    {{- end }}
    {{- if .Values.ingress.healthCheckTimeoutSeconds }}
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: {{ .Values.ingress.healthCheckTimeoutSeconds | quote }}
    {{- end }}
    {{- if .Values.ingress.healthCheckHealthyThresholdCount }}
    alb.ingress.kubernetes.io/healthcheck-healthy-threshold-count: {{ .Values.ingress.healthCheckHealthyThresholdCount | quote }}
    {{- end }}
    {{- if .Values.ingress.healthCheckUnhealthyThresholdCount }}
    alb.ingress.kubernetes.io/healthcheck-unhealthy-threshold-count: {{ .Values.ingress.healthCheckUnhealthyThresholdCount | quote }}
    {{- end }}
    {{- if .Values.ingress.loadBalancerAttributes }}
    alb.ingress.kubernetes.io/load-balancer-attributes: {{ .Values.ingress.loadBalancerAttributes | quote }}
    {{- end }}
spec:
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ .path | default "/" }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "shopify_app_dista_checkout.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}

