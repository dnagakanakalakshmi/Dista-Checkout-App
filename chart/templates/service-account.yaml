{{ if .Values.serviceAccount.enabled}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "backend-access-shopify-app.fullname" . }}
  annotations:
    "helm.sh/hook": pre-install
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.annotation}}
  labels:
    app: {{ include "backend-access-shopify-app.fullname" . }}
 {{ end }}