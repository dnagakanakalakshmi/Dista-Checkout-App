# templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend-access-shopify-app.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "backend-access-shopify-app.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "backend-access-shopify-app.fullname" . }}
    spec:
      {{if .Values.serviceAccount.enabled}}
      serviceAccountName: {{ include "backend-access-shopify-app.fullname" . }}
      {{end}}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ACTIVE_ENV
              value: {{ .Values.env | quote }}
            {{- if .Values.envVars }}
            {{- range $key, $value := .Values.envVars }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.awsSecretsManager.enabled }}
            - name: AWS_REGION
              value: {{ .Values.awsSecretsManager.region | quote }}
            {{- if .Values.awsSecretsManager.secretName }}
            - name: AWS_APP_SECRET_NAME
              value: {{ .Values.awsSecretsManager.secretName | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.secrets.enabled }}
            {{- if .Values.secrets.databaseUrl }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend-access-shopify-app.fullname" . }}
                  key: DATABASE_URL
            {{- end }}
            {{- if .Values.secrets.shopifyApiKey }}
            - name: SHOPIFY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend-access-shopify-app.fullname" . }}
                  key: SHOPIFY_API_KEY
            {{- end }}
            {{- if .Values.secrets.shopifyApiSecret }}
            - name: SHOPIFY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend-access-shopify-app.fullname" . }}
                  key: SHOPIFY_API_SECRET
            {{- end }}
            {{- if .Values.secrets.scopes }}
            - name: SCOPES
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend-access-shopify-app.fullname" . }}
                  key: SCOPES
            {{- end }}
            {{- if .Values.secrets.mongodbUrl }}
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend-access-shopify-app.fullname" . }}
                  key: MONGODB_URL
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3