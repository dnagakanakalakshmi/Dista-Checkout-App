# templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shopify_app_dista_checkout.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: {{ include "shopify_app_dista_checkout.fullname" . }}
