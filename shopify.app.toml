# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "976ff1a8ed1f4d60f7e356f2026a7b9f"
name = "Dista Checkout App"
application_url = "https://shopify-app-dista-checkout.dista.care/"
embedded = true

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_delivery_customizations,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://shopify-app-dista-checkout.dista.care/auth",
  "https://shopify-app-dista-checkout.dista.care/auth/callback",
  "https://shopify-app-dista-checkout.dista.care/auth/shopify/callback"
]
