# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "976ff1a8ed1f4d60f7e356f2026a7b9f"
name = "distausa-app-check"
application_url = "https://shopify-app-dista-checkout.dista.care/"
embedded = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://shopify-app-dista-checkout.dista.care/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "https://shopify-app-dista-checkout.dista.care/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_delivery_customizations,read_products,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://shopify-app-dista-checkout.dista.care/api/auth"
]

[build]
automatically_update_urls_on_dev = true
